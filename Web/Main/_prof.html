<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Профили. Народный контроллер ТН</title>
<link rel="stylesheet" href="_style.css">
<script src="scripts.js"></script>
<script src="_m.js"></script>
<script>
urlupdate = 6000;
window.onload = function() {
	loadParam("get_Prof(ID),get_Prof(NAME),get_Prof(DATE),get_Prof(CRC16),get_Prof(NOTE),get_Prof(ENABLE),get_Prof(NUM)");
};
function loadParam_after(paramid) {
	if(paramid.match(/^eraseProfile|^loadProfile|^set_SAVE/)) location.reload();
}
</script>
</head>
<body class="prof">
<div id="menu"><script src="_menu.js"></script></div>
<main>

<div class="card">
	<h2>Текущий профиль</h2>
	<div class="row"><span class="k">Номер профиля<sup>*</sup></span><span class="v">
		<input id="get_prof-id" type="number" min="1">
		<input id="get_prof-id2" type="submit" value="&gt;" onclick="setParam('get_Prof(ID)');"></span></div>
	<div class="row"><span class="k">Имя профиля</span><span class="v">
		<input id="get_prof-name" type="text">
		<input id="get_prof-name2" type="submit" value="&gt;" onclick="setParam('get_Prof(NAME)');"></span></div>
	<div class="row"><span class="k">Описание профиля</span><span class="v">
		<input id="get_prof-note" type="text">
		<input id="get_prof-note2" type="submit" value="&gt;" onclick="setParam('get_Prof(NOTE)');"></span></div>
	<div class="row"><span class="k">Использовать профиль в списке</span><span class="v">
		<input type="checkbox" name="get_prof-enable" id="get_prof-enable" onchange="setParam('get_Prof(ENABLE)');"></span></div>
	<div class="row"><span class="k">Последнее редактирование</span>
		<span class="v wide"><span id="get_prof-date"></span></span></div>
	<div class="hint">* старый профиль с этим номером при сохранении будет заменён.</div>
</div>

<div class="acts">
	<input type="submit" value="Записать в EEPROM" onclick='loadParam("set_SAVE")'>
</div>

<div class="card">
	<h2>Таблица профилей</h2>
	<div class="scroll">
	<table>
	<thead><tr><th>Номер</th><th>Описание</th><th>Действие</th></tr></thead>
	<tbody id="get_prof-num"></tbody>
	</table>
	</div>
</div>

</main>
</body>
</html>
