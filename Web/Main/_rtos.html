<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ОС RTOS. Народный контроллер ТН</title>
<link rel="stylesheet" href="_style.css">
<script src="scripts.js"></script>
<script src="_m.js"></script>
<script>
urlupdate = 3000;
window.onload = function() { updateParam("TASK_LIST"); };
var sorting = [ [ 0|0, 1|0 ] ]; // [col, dir]
function sortTable(tbln, n) {
	var table,rows,switching,i,rx,x,ry,y,shouldSwitch,dir;
	var namecol = 1;
	table = document.getElementById("tbl" + tbln);
	switching = true;
	if(n == -1) {
		n = sorting[tbln][0];
	} else {
		xr = table.getElementsByTagName("TH");
		xr[sorting[tbln][0]].innerHTML = xr[sorting[tbln][0]].innerHTML.replace(/↓|↑/g, "");
		if(n != sorting[tbln][0]) {
			sorting[tbln][0] = n;
			sorting[tbln][1] = 1;
		} else sorting[tbln][1] ^= 1;
		xr[n].innerHTML = xr[n].innerHTML + (sorting[tbln][1] ? "↓" : "↑");
	}
	dir = sorting[tbln][1];
	while (switching) {
		switching = false;
		rows = table.getElementsByTagName("TR");
		for(i = 1; i < (rows.length - 1); i++) {
			shouldSwitch = false;
			rx = rows[i].getElementsByTagName("TD");
			ry = rows[i + 1].getElementsByTagName("TD");
			if(!rx[n] || !ry[n]) continue;
			x = rx[n].innerText;
			if(x.match(/^\d|^</)) {
				x = Number(x.replace(/[<%]/g,""));
				y = Number(ry[n].innerText.replace(/[<%]/g,""));
			} else {
				x = x.toLowerCase();
				y = ry[n].innerHTML.toLowerCase();
			}
			if(dir == 1) {
				if(x > y || (x == y && rx[namecol].innerHTML.toLowerCase() > ry[namecol].innerHTML.toLowerCase())) {
					shouldSwitch = true;
					break;
				}
			} else if(dir == 0) {
				if(x < y || (x == y && rx[namecol].innerHTML.toLowerCase() < ry[namecol].innerHTML.toLowerCase())) {
					shouldSwitch = true;
					break;
				}
			}
		}
		if(shouldSwitch) {
			rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
			switching = true;
		}
	}
}
function loadParam_after(paramid) {
	if(paramid.indexOf("TASK_") != -1) sortTable(0, -1);
}
</script>
</head>
<body class="rtos">
<div id="menu"><script src="_menu.js"></script></div>
<main>
<div class="acts">
	<input type="submit" value="Обнулить время" onclick='if(confirm("Очистить статистику?")) loadParam("TASK_LIST_RST");'>
</div>
<div class="card">
	<h2>Список задач</h2>
	<div class="scroll">
	<table id="tbl0">
	<thead><tr>
		<th onclick="sortTable(0,0)">№ ↓</th>
		<th onclick="sortTable(0,1)">Задача</th>
		<th onclick="sortTable(0,2)">Статус</th>
		<th onclick="sortTable(0,3)">Приор.</th>
		<th onclick="sortTable(0,4)">Стек мин., 4b</th>
		<th onclick="sortTable(0,5)">Время, мс</th>
		<th onclick="sortTable(0,6)">Итого</th>
	</tr></thead>
	<tbody id="task_list"><tr></tr></tbody>
	</table>
	</div>
	<div class="hint">Сортировка — тап по шапке таблицы.</div>
</div>
</main>
</body>
</html>
